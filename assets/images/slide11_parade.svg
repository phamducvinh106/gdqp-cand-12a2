<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="paradeSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF3A8"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>

  <!-- Nền Quảng Trường & Trời Xanh Nắng Sớm -->
  <rect width="1200" height="420" fill="url(#paradeSky)"/>
  <rect y="420" width="1200" height="255" fill="url(#groundGrad)"/>
  <!-- Vạch kẻ thao diễn -->
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#FACC15" stroke-width="3" stroke-dasharray="30 20"/>

  <!-- Khối Học Viên CAND Diễu Binh Thẳng Tắp (Cadet Parade Block) -->
  <g transform="translate(180, 260)">
    <!-- Hàng 3 (Sau cùng) -->
    <g fill="#064E3B" opacity="0.6" transform="translate(40, -40)">
      <circle cx="100" cy="50" r="24"/><rect x="76" y="80" width="48" height="90" rx="8"/>
      <circle cx="220" cy="50" r="24"/><rect x="196" y="80" width="48" height="90" rx="8"/>
      <circle cx="340" cy="50" r="24"/><rect x="316" y="80" width="48" height="90" rx="8"/>
      <circle cx="460" cy="50" r="24"/><rect x="436" y="80" width="48" height="90" rx="8"/>
      <circle cx="580" cy="50" r="24"/><rect x="556" y="80" width="48" height="90" rx="8"/>
      <circle cx="700" cy="50" r="24"/><rect x="676" y="80" width="48" height="90" rx="8"/>
    </g>

    <!-- Hàng 2 (Ở giữa) -->
    <g fill="#047857" opacity="0.8" transform="translate(20, -20)">
      <circle cx="100" cy="50" r="26"/><rect x="74" y="80" width="52" height="95" rx="8"/>
      <circle cx="220" cy="50" r="26"/><rect x="194" y="80" width="52" height="95" rx="8"/>
      <circle cx="340" cy="50" r="26"/><rect x="314" y="80" width="52" height="95" rx="8"/>
      <circle cx="460" cy="50" r="26"/><rect x="434" y="80" width="52" height="95" rx="8"/>
      <circle cx="580" cy="50" r="26"/><rect x="554" y="80" width="52" height="95" rx="8"/>
      <circle cx="700" cy="50" r="26"/><rect x="674" y="80" width="52" height="95" rx="8"/>
    </g>

    <!-- Hàng 1 (Tiên phong - Sắc nét) -->
    <g fill="#065F46">
      <!-- Học viên 1 -->
      <circle cx="100" cy="50" r="28" fill="#F87171"/>
      <path d="M 72 50 Q 100 20 128 50" fill="#064E3B"/>
      <rect x="70" y="82" width="60" height="110" rx="10" fill="#065F46"/>
      <line x1="100" y1="82" x2="100" y2="192" stroke="#FACC15" stroke-width="3"/>
      <!-- Học viên 2 -->
      <circle cx="220" cy="50" r="28" fill="#F87171"/>
      <path d="M 192 50 Q 220 20 248 50" fill="#064E3B"/>
      <rect x="190" y="82" width="60" height="110" rx="10" fill="#065F46"/>
      <line x1="220" y1="82" x2="220" y2="192" stroke="#FACC15" stroke-width="3"/>
      <!-- Học viên 3 -->
      <circle cx="340" cy="50" r="28" fill="#F87171"/>
      <path d="M 312 50 Q 340 20 368 50" fill="#064E3B"/>
      <rect x="310" y="82" width="60" height="110" rx="10" fill="#065F46"/>
      <line x1="340" y1="82" x2="340" y2="192" stroke="#FACC15" stroke-width="3"/>
      <!-- Học viên 4 -->
      <circle cx="460" cy="50" r="28" fill="#F87171"/>
      <path d="M 432 50 Q 460 20 488 50" fill="#064E3B"/>
      <rect x="430" y="82" width="60" height="110" rx="10" fill="#065F46"/>
      <line x1="460" y1="82" x2="460" y2="192" stroke="#FACC15" stroke-width="3"/>
      <!-- Học viên 5 -->
      <circle cx="580" cy="50" r="28" fill="#F87171"/>
      <path d="M 552 50 Q 580 20 608 50" fill="#064E3B"/>
      <rect x="550" y="82" width="60" height="110" rx="10" fill="#065F46"/>
      <line x1="580" y1="82" x2="580" y2="192" stroke="#FACC15" stroke-width="3"/>
      <!-- Học viên 6 -->
      <circle cx="700" cy="50" r="28" fill="#F87171"/>
      <path d="M 672 50 Q 700 20 728 50" fill="#064E3B"/>
      <rect x="670" y="82" width="60" height="110" rx="10" fill="#065F46"/>
      <line x1="700" y1="82" x2="700" y2="192" stroke="#FACC15" stroke-width="3"/>
    </g>
  </g>

  <!-- Khẩu Hiệu Quân Đội CAND -->
  <rect x="320" y="40" width="560" height="50" rx="8" fill="#B91C1C" stroke="url(#goldBanner)" stroke-width="3"/>
  <text x="600" y="73" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="900" fill="#FFF3A8" text-anchor="middle" letter-spacing="2">
    TRANG BỊ TOÀN DIỆN • KỶ LUẬT THÉP • VÌ NƯỚC QUÊN THÂN
  </text>
</svg>
