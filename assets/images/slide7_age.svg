<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="ageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
  </defs>

  <rect width="500" height="320" fill="url(#ageBg)"/>

  <!-- ĐỒNG HỒ & THƯỚC ĐỘ TUỔI -->
  <g transform="translate(150, 40)">
    <rect x="0" y="0" width="200" height="230" rx="10" fill="#1e293b" stroke="#e879f9" stroke-width="3"/>
    
    <circle cx="100" cy="70" r="45" fill="#581c87" stroke="#e879f9" stroke-width="2"/>
    <text x="100" y="68" font-family="'Be Vietnam Pro', sans-serif" font-size="22" font-weight="900" fill="#f5d0fe" text-anchor="middle">TUỔI</text>
    <text x="100" y="86" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="bold" fill="#e879f9" text-anchor="middle">QUY ĐỊNH</text>

    <!-- Hai mốc tuổi nổi bật -->
    <rect x="15" y="130" width="170" height="36" rx="6" fill="#831843"/>
    <text x="25" y="152" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" fill="#fbcfe8">Dân tộc Kinh:</text>
    <text x="165" y="152" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="900" fill="#f43f5e" text-anchor="end">≤ 22</text>

    <rect x="15" y="175" width="170" height="36" rx="6" fill="#065f46"/>
    <text x="25" y="197" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">Dân tộc thiểu số:</text>
    <text x="165" y="197" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="900" fill="#34d399" text-anchor="end">≤ 25</text>
  </g>
</svg>
