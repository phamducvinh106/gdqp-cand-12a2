<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="rnkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="rnkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="500" height="320" fill="url(#rnkBg)"/>

  <g transform="translate(150, 40)">
    <rect x="0" y="0" width="200" height="230" rx="12" fill="#1e293b" stroke="url(#rnkGold)" stroke-width="3"/>
    
    <!-- Cầu vai quân hàm sĩ quan CAND -->
    <polygon points="60,20 140,20 150,110 50,110" fill="#dc2626" stroke="url(#rnkGold)" stroke-width="3"/>
    <circle cx="100" cy="35" r="8" fill="url(#rnkGold)"/>
    <!-- Vạch & Sao sĩ quan -->
    <polygon points="100,55 104,65 115,65 106,72 109,82 100,76 91,82 94,72 85,65 96,65" fill="url(#rnkGold)"/>
    <line x1="65" y1="95" x2="135" y2="95" stroke="url(#rnkGold)" stroke-width="4"/>

    <text x="100" y="145" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="900" fill="#fde047" text-anchor="middle">PHONG CẤP BẬC HÀM</text>
    <text x="100" y="165" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">SĨ QUAN CHÍNH QUY</text>

    <!-- 100% việc làm -->
    <rect x="15" y="180" width="170" height="32" rx="6" fill="#991b1b"/>
    <text x="100" y="200" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="700" fill="#fef08a" text-anchor="middle">100% PHÂN CÔNG CÔNG TÁC</text>
  </g>
</svg>
