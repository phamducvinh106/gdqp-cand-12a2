<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="40%" stop-color="#FF5722"/>
      <stop offset="70%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FFEB3B"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1115"/>
      <stop offset="100%" stop-color="#110507"/>
    </linearGradient>
    <filter id="shadow3D3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Vành Khiên PCCC & CNCH -->
  <circle cx="250" cy="250" r="215" fill="url(#darkBg)" stroke="url(#goldGrad3)" stroke-width="12" filter="url(#shadow3D3)"/>
  <circle cx="250" cy="250" r="198" fill="none" stroke="#D32F2F" stroke-width="4"/>

  <!-- Hai Chiếc Rìu Cứu Nạn Chéo Nhau -->
  <g stroke="url(#goldGrad3)" stroke-width="10" stroke-linecap="round">
    <line x1="120" y1="120" x2="380" y2="380"/>
    <line x1="380" y1="120" x2="120" y2="380"/>
  </g>
  <!-- Lưỡi rìu trái và phải -->
  <path d="M 110 110 L 150 90 L 160 130 L 120 145 Z" fill="url(#goldGrad3)"/>
  <path d="M 390 110 L 350 90 L 340 130 L 380 145 Z" fill="url(#goldGrad3)"/>

  <!-- Ngọn Lửa Thiêng Bừng Sáng -->
  <path d="M 250 110 C 270 160 320 200 320 270 C 320 330 275 365 250 365 C 225 365 180 330 180 270 C 180 215 220 170 250 110 Z" 
        fill="url(#fireGrad)" filter="url(#shadow3D3)"/>

  <!-- Lõi Lửa Vàng Nóng Rực -->
  <path d="M 250 200 C 265 230 290 260 290 295 C 290 330 265 345 250 345 C 235 345 210 330 210 295 C 210 265 235 235 250 200 Z" 
        fill="#FFF9C4"/>

  <!-- Ngôi Sao Vàng Đỉnh Ngọn Lửa -->
  <polygon points="250,150 256,168 275,168 260,179 265,198 250,186 235,198 240,179 225,168 244,168" 
           fill="url(#goldGrad3)" stroke="#FFF" stroke-width="1"/>

  <!-- Cành Tùng Mạ Vàng -->
  <path d="M 120 290 C 110 380 180 435 250 450 C 320 435 390 380 380 290" 
        fill="none" stroke="url(#goldGrad3)" stroke-width="14" stroke-linecap="round" filter="url(#shadow3D3)"/>

  <!-- Dải Nhãn Lực Lượng PCCC & CNCH -->
  <rect x="135" y="380" width="230" height="34" rx="17" fill="url(#goldGrad3)" stroke="#670000" stroke-width="2"/>
  <text x="250" y="403" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="900" fill="#670000" text-anchor="middle" letter-spacing="1">
    CẢNH SÁT PCCC &amp; CNCH
  </text>
</svg>
