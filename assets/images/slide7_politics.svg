<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="polBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="polGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="500" height="320" fill="url(#polBg)"/>

  <!-- CUỐN SỔ LÝ LỊCH 3 ĐỜI TRONG SẠCH -->
  <g transform="translate(150, 40)">
    <rect x="0" y="0" width="200" height="230" rx="10" fill="#991b1b" stroke="url(#polGold)" stroke-width="3"/>
    <circle cx="100" cy="60" r="30" fill="#7f1d1d" stroke="url(#polGold)" stroke-width="2"/>
    <polygon points="100,42 106,56 120,56 109,64 113,78 100,69 87,78 91,64 80,56 94,56" fill="url(#polGold)"/>
    
    <text x="100" y="125" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="900" fill="#fde047" text-anchor="middle">LÝ LỊCH CHÍNH TRỊ</text>
    <text x="100" y="145" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="bold" fill="#fef08a" text-anchor="middle">3 ĐỜI TRONG SẠCH</text>

    <!-- Dấu kiểm tra đạt chuẩn -->
    <rect x="25" y="170" width="150" height="35" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="100" y="192" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="900" fill="#86efac" text-anchor="middle">✓ ĐỦ CHUẨN KẾT NẠP</text>
  </g>
</svg>
