<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="southBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <rect width="600" height="350" fill="url(#southBg)"/>

  <!-- BẢN ĐỒ VIỆT NAM KHU VỰC PHÍA NAM & ĐÀ NẴNG TRỞ VÀO -->
  <g transform="translate(100, 30)">
    <!-- Bản đồ cách điệu -->
    <path d="M 60 20 Q 90 50 110 90 Q 130 140 160 170 Q 180 200 150 240 Q 120 260 90 270 Q 70 250 80 230 Q 110 200 80 150 Q 50 100 60 20 Z" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

    <!-- Điểm mốc Đà Nẵng -->
    <circle cx="95" cy="55" r="6" fill="#facc15" stroke="#ffffff" stroke-width="2"/>
    <text x="110" y="60" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" fill="#facc15">Ranh giới Đà Nẵng</text>

    <!-- Điểm mốc TP. Hồ Chí Minh -->
    <circle cx="125" cy="225" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="145" y="230" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="900" fill="#f87171">TP. HỒ CHÍ MINH</text>
    <text x="145" y="246" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="bold" fill="#93c5fd">Trụ sở ĐH ANND &amp; ĐH CSND</text>
  </g>

  <!-- BIỂU TƯỢNG HAI TRƯỜNG ĐH PHÍA NAM -->
  <g transform="translate(360, 60)">
    <rect x="0" y="0" width="200" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="28" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="900" fill="#fde047" text-anchor="middle">ĐH AN NINH NHÂN DÂN</text>
    <text x="100" y="48" font-family="'Be Vietnam Pro', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Mã trường: T04 • Thủ Đức</text>
    <text x="100" y="70" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">Đào tạo An ninh Phía Nam</text>

    <rect x="0" y="115" width="200" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="143" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="900" fill="#fde047" text-anchor="middle">ĐH CẢNH SÁT NHÂN DÂN</text>
    <text x="100" y="163" font-family="'Be Vietnam Pro', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Mã trường: T05 • Quận 7</text>
    <text x="100" y="185" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">Đào tạo Cảnh sát Phía Nam</text>
  </g>

  <rect x="50" y="295" width="500" height="30" rx="6" fill="#172554" stroke="#eab308" stroke-width="1"/>
  <text x="300" y="315" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#fde047" text-anchor="middle">PHÂN VÙNG TUYỂN SINH: TỪ ĐÀ NẴNG TRỞ VÀO PHÍA NAM</text>
</svg>
