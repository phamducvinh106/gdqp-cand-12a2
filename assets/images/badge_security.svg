<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients Vàng Kim & Đỏ Cờ CAND -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52D27"/>
      <stop offset="50%" stop-color="#B71C1C"/>
      <stop offset="100%" stop-color="#670000"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFF77" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Vòng Hào Quang Tỏa Sáng Nền -->
  <circle cx="250" cy="250" r="230" fill="url(#starGlow)" opacity="0.4"/>

  <!-- Vòng Tròn Viền Vàng Kim & Bánh Răng Lịch Sử -->
  <circle cx="250" cy="250" r="210" fill="#0D1B2A" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow3D)"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Khiên Bảo Vệ An Ninh Đỏ Son -->
  <path d="M 250 85 Q 360 85 360 170 Q 360 310 250 405 Q 140 310 140 170 Q 140 85 250 85 Z" 
        fill="url(#redShieldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow3D)"/>

  <!-- Ngôi Sao Vàng Năm Cánh (Quốc Huy & Quân Hiệu) -->
  <g transform="translate(250, 220) scale(1.15)">
    <polygon points="0,-75 22,-23 78,-23 33,10 50,65 0,32 -50,65 -33,10 -78,-23 -22,-23" 
             fill="url(#goldGrad)" stroke="#FFEAA7" stroke-width="2" filter="url(#shadow3D)"/>
    <!-- Khối 3D cho cánh sao -->
    <polygon points="0,-75 0,0 22,-23" fill="#FFEAA7" opacity="0.6"/>
    <polygon points="78,-23 0,0 33,10" fill="#FFEAA7" opacity="0.6"/>
    <polygon points="50,65 0,0 0,32" fill="#FFEAA7" opacity="0.6"/>
    <polygon points="-50,65 0,0 -33,10" fill="#B78A02" opacity="0.7"/>
    <polygon points="-78,-23 0,0 -22,-23" fill="#B78A02" opacity="0.7"/>
  </g>

  <!-- Dải Cành Tùng Mạ Vàng Ôm Hai Bên Khiên -->
  <path d="M 125 280 C 110 370 170 425 250 450 C 330 425 390 370 375 280" 
        fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#shadow3D)"/>
  
  <!-- Chữ Danh Dự & Bản Lĩnh -->
  <rect x="150" y="380" width="200" height="34" rx="17" fill="url(#goldGrad)" stroke="#670000" stroke-width="2"/>
  <text x="250" y="403" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="900" fill="#670000" text-anchor="middle" letter-spacing="2">
    AN NINH NHÂN DÂN
  </text>
</svg>
