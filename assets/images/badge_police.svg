<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="bluePoliceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3B6F"/>
      <stop offset="50%" stop-color="#0F2547"/>
      <stop offset="100%" stop-color="#06101E"/>
    </linearGradient>
    <linearGradient id="redPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52D27"/>
      <stop offset="100%" stop-color="#8E0E00"/>
    </linearGradient>
    <filter id="shadow3D2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Nền Tròn Khiên Cảnh Sát Nhân Dân -->
  <circle cx="250" cy="250" r="215" fill="url(#bluePoliceGrad)" stroke="url(#goldGrad2)" stroke-width="12" filter="url(#shadow3D2)"/>
  <circle cx="250" cy="250" r="198" fill="none" stroke="url(#goldGrad2)" stroke-width="3" stroke-dasharray="8 4"/>

  <!-- Vành Khiên Đỏ Trong -->
  <circle cx="250" cy="250" r="160" fill="url(#redPillar)" stroke="url(#goldGrad2)" stroke-width="6"/>

  <!-- Thanh Kiếm Công Lý Nằm Thẳng Đứng -->
  <path d="M 245 70 L 255 70 L 253 360 L 247 360 Z" fill="url(#goldGrad2)"/>
  <rect x="230" y="110" width="40" height="10" rx="3" fill="url(#goldGrad2)"/>
  <circle cx="250" cy="370" r="12" fill="url(#goldGrad2)"/>

  <!-- Cán Cân Công Lý (Biểu Tượng Pháp Luật & Trật Tự) -->
  <path d="M 170 170 Q 250 145 330 170" fill="none" stroke="url(#goldGrad2)" stroke-width="6" stroke-linecap="round"/>
  <!-- Đĩa cân trái -->
  <line x1="170" y1="170" x2="140" y2="230" stroke="url(#goldGrad2)" stroke-width="3"/>
  <line x1="170" y1="170" x2="200" y2="230" stroke="url(#goldGrad2)" stroke-width="3"/>
  <path d="M 130 230 Q 170 255 210 230 Z" fill="url(#goldGrad2)" filter="url(#shadow3D2)"/>

  <!-- Đĩa cân phải -->
  <line x1="330" y1="170" x2="300" y2="230" stroke="url(#goldGrad2)" stroke-width="3"/>
  <line x1="330" y1="170" x2="360" y2="230" stroke="url(#goldGrad2)" stroke-width="3"/>
  <path d="M 290 230 Q 330 255 370 230 Z" fill="url(#goldGrad2)" filter="url(#shadow3D2)"/>

  <!-- Ngôi Sao Vàng Rực Rỡ Trung Tâm -->
  <polygon points="250,195 261,225 292,225 267,243 276,273 250,255 224,273 233,243 208,225 239,225" 
           fill="url(#goldGrad2)" stroke="#FFF" stroke-width="1.5" filter="url(#shadow3D2)"/>

  <!-- Dải Cành Tùng Bao Quanh Đáy -->
  <path d="M 120 290 C 110 380 180 435 250 450 C 320 435 390 380 380 290" 
        fill="none" stroke="url(#goldGrad2)" stroke-width="14" stroke-linecap="round" filter="url(#shadow3D2)"/>

  <!-- Dải Nhãn Danh Dự -->
  <rect x="140" y="380" width="220" height="34" rx="17" fill="url(#goldGrad2)" stroke="#0F2547" stroke-width="2"/>
  <text x="250" y="403" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="900" fill="#0F2547" text-anchor="middle" letter-spacing="2">
    CẢNH SÁT NHÂN DÂN
  </text>
</svg>
