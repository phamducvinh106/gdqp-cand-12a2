<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="emblemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe259" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b71c1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="redShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- HÀO QUANG PHÁT SÁNG NỀN -->
  <circle cx="300" cy="300" r="280" fill="url(#emblemGlow)"/>

  <!-- VÒNG TRÒN BÁNH XE LỊCH SỬ & BÔNG LÚA VIỀN VÀNG -->
  <g filter="url(#shadow3D)">
    <circle cx="300" cy="300" r="230" fill="#0f172a" stroke="url(#goldPlate)" stroke-width="12"/>
    <circle cx="300" cy="300" r="205" fill="none" stroke="#eab308" stroke-width="3" stroke-dasharray="10,6"/>
  </g>

  <!-- LÁ CHẮN BẢO VỆ TỔ QUỐC (SHIELD) -->
  <g filter="url(#shadow3D)">
    <path d="M 200 170 Q 300 150 400 170 Q 420 310 300 440 Q 180 310 200 170 Z" fill="url(#redShield)" stroke="url(#goldPlate)" stroke-width="8"/>
  </g>

  <!-- NGÔI SAO VÀNG NĂM CÁNH TRUNG TÂM -->
  <g transform="translate(300, 280) scale(1.1)" filter="url(#shadow3D)">
    <polygon points="0,-75 22,-23 75,-23 32,10 49,63 0,30 -49,63 -32,10 -75,-23 -22,-23" fill="url(#goldPlate)" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- BĂNG ĐỎ CHỮ VÀNG "CÔNG AN NHÂN DÂN" -->
  <g transform="translate(300, 470)" filter="url(#shadow3D)">
    <path d="M -180 -15 Q 0 -35 180 -15 L 170 30 Q 0 10 -170 30 Z" fill="#991b1b" stroke="url(#goldPlate)" stroke-width="4"/>
    <text x="0" y="14" font-family="'Be Vietnam Pro', sans-serif" font-size="20" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="3">CÔNG AN NHÂN DÂN</text>
  </g>

  <!-- HAI THANH KIẾM BẮT CHÉO PHÍA SAU LÁ CHẮN -->
  <g opacity="0.85">
    <line x1="140" y1="140" x2="460" y2="460" stroke="url(#goldPlate)" stroke-width="8" stroke-linecap="round"/>
    <line x1="460" y1="140" x2="140" y2="460" stroke="url(#goldPlate)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
