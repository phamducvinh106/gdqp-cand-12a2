<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="arenaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="cupGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="fireworkGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- NỀN ĐẤU TRƯỜNG -->
  <rect width="800" height="450" fill="url(#arenaBg)"/>

  <!-- TIA SÁNG SÂN KHẤU (SPOTLIGHTS) -->
  <polygon points="0,0 250,450 350,450" fill="white" opacity="0.04"/>
  <polygon points="800,0 450,450 550,450" fill="white" opacity="0.04"/>
  <polygon points="400,0 300,450 500,450" fill="#facc15" opacity="0.06"/>

  <!-- PHÁO HOA TRÊN BẦU TRỜI -->
  <g transform="translate(180, 100)" stroke="url(#fireworkGlow)" stroke-width="2" opacity="0.8">
    <line x1="0" y1="0" x2="0" y2="-40"/>
    <line x1="0" y1="0" x2="28" y2="-28"/>
    <line x1="0" y1="0" x2="40" y2="0"/>
    <line x1="0" y1="0" x2="28" y2="28"/>
    <line x1="0" y1="0" x2="0" y2="40"/>
    <line x1="0" y1="0" x2="-28" y2="28"/>
    <line x1="0" y1="0" x2="-40" y2="0"/>
    <line x1="0" y1="0" x2="-28" y2="-28"/>
    <circle cx="0" cy="0" r="4" fill="#facc15"/>
  </g>

  <g transform="translate(620, 110)" stroke="url(#fireworkGlow)" stroke-width="2" opacity="0.8">
    <line x1="0" y1="0" x2="0" y2="-45"/>
    <line x1="0" y1="0" x2="32" y2="-32"/>
    <line x1="0" y1="0" x2="45" y2="0"/>
    <line x1="0" y1="0" x2="32" y2="32"/>
    <line x1="0" y1="0" x2="0" y2="45"/>
    <line x1="0" y1="0" x2="-32" y2="32"/>
    <line x1="0" y1="0" x2="-45" y2="0"/>
    <line x1="0" y1="0" x2="-32" y2="-32"/>
    <circle cx="0" cy="0" r="5" fill="#ef4444"/>
  </g>

  <!-- BỤC VINH QUANG PODIUM -->
  <g transform="translate(260, 270)">
    <!-- Bục số 1 (Trung tâm) -->
    <rect x="80" y="0" width="120" height="150" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="3" filter="url(#superGlow)"/>
    <text x="140" y="70" font-family="'Be Vietnam Pro', sans-serif" font-size="32" font-weight="900" fill="#facc15" text-anchor="middle">1</text>
    <text x="140" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">QUÁN QUÂN</text>

    <!-- Bục số 2 (Trái) -->
    <rect x="-30" y="40" width="100" height="110" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <text x="20" y="95" font-family="'Be Vietnam Pro', sans-serif" font-size="26" font-weight="900" fill="#cbd5e1" text-anchor="middle">2</text>

    <!-- Bục số 3 (Phải) -->
    <rect x="210" y="60" width="100" height="90" rx="8" fill="#0f172a" stroke="#b45309" stroke-width="2"/>
    <text x="260" y="110" font-family="'Be Vietnam Pro', sans-serif" font-size="24" font-weight="900" fill="#d97706" text-anchor="middle">3</text>
  </g>

  <!-- CÚP VÀNG CHIẾN THẮNG TRÊN ĐỈNH BỤC SỐ 1 -->
  <g transform="translate(365, 120)" filter="url(#superGlow)">
    <!-- Thân cúp -->
    <path d="M 10 15 C 10 65, 60 65, 60 15 Z" fill="url(#cupGold)" stroke="#d97706" stroke-width="2"/>
    <!-- Miệng cúp -->
    <ellipse cx="35" cy="15" rx="25" ry="8" fill="#fef08a"/>
    <!-- Chân đế cúp -->
    <path d="M 30 65 L 40 65 L 45 100 L 25 100 Z" fill="url(#cupGold)"/>
    <rect x="15" y="100" width="40" height="20" rx="4" fill="#78350f" stroke="#facc15" stroke-width="1.5"/>
    <text x="35" y="114" font-family="'Be Vietnam Pro', sans-serif" font-size="8" font-weight="900" fill="#fef08a" text-anchor="middle">BCA 2024</text>
    <!-- Quai cúp 2 bên -->
    <path d="M 10 25 C -15 25, -15 50, 15 50" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 25 C 85 25, 85 50, 55 50" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round"/>
    <!-- Ngôi sao phát sáng giữa cúp -->
    <polygon points="35,28 38,36 46,36 40,41 42,49 35,44 28,49 30,41 24,36 32,36" fill="#ffffff"/>
  </g>

  <!-- BANNER "ĐẤU TRƯỜNG TRI THỨC CAND" -->
  <g transform="translate(400, 50)" filter="url(#superGlow)">
    <rect x="-180" y="0" width="360" height="40" rx="20" fill="#b71c1c" stroke="#facc15" stroke-width="2"/>
    <text x="0" y="25" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="900" fill="#fffbeb" text-anchor="middle" letter-spacing="2">ĐẤU TRƯỜNG TRI THỨC CAND</text>
  </g>
</svg>
