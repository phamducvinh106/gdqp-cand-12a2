<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071526"/>
      <stop offset="100%" stop-color="#0d2b45"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#medBg)"/>

  <!-- 4 Khối Đồ Họa Tiêu Chuẩn Y Tế Tuyển Sinh CAND -->
  
  <!-- 1. Thước Đo Chiều Cao Nam (>= 1m64) & Nữ (>= 1m58) -->
  <g transform="translate(120, 100)">
    <rect width="210" height="420" rx="16" fill="#0E243A" stroke="#2EC4B6" stroke-width="2"/>
    <text x="105" y="45" font-family="'Be Vietnam Pro'" font-size="16" font-weight="900" fill="#2EC4B6" text-anchor="middle">CHIỀU CAO - THỂ LỰC</text>
    <!-- Thước đo -->
    <line x1="45" y1="90" x2="45" y2="350" stroke="#FACC15" stroke-width="6"/>
    <line x1="45" y1="120" x2="70" y2="120" stroke="#FACC15" stroke-width="3"/>
    <text x="80" y="125" fill="#FACC15" font-size="12" font-weight="bold">1m95 (Max)</text>
    <line x1="45" y1="200" x2="80" y2="200" stroke="#2EC4B6" stroke-width="4"/>
    <text x="90" y="205" fill="#2EC4B6" font-size="13" font-weight="bold">Nam ≥ 1m64</text>
    <line x1="45" y1="260" x2="80" y2="260" stroke="#FF6B6B" stroke-width="4"/>
    <text x="90" y="265" fill="#FF6B6B" font-size="13" font-weight="bold">Nữ ≥ 1m58</text>
    <!-- Cân nặng -->
    <rect x="30" y="360" width="150" height="36" rx="8" fill="#1A3857"/>
    <text x="105" y="384" fill="#E2E8F0" font-size="12" font-weight="bold" text-anchor="middle">Nam ≥ 50kg • Nữ ≥ 45kg</text>
  </g>

  <!-- 2. Bảng Đo Thị Lực (Eye Chart) -->
  <g transform="translate(370, 100)">
    <rect width="210" height="420" rx="16" fill="#0E243A" stroke="#FACC15" stroke-width="2"/>
    <text x="105" y="45" font-family="'Be Vietnam Pro'" font-size="16" font-weight="900" fill="#FACC15" text-anchor="middle">THỊ LỰC TIÊU CHUẨN</text>
    <rect x="40" y="80" width="130" height="240" fill="#FFFFFF" rx="8"/>
    <!-- Chữ E, F, P bảng thị lực -->
    <text x="105" y="130" font-size="42" font-weight="900" fill="#000" text-anchor="middle">E</text>
    <text x="105" y="180" font-size="28" font-weight="900" fill="#000" text-anchor="middle">F  P</text>
    <text x="105" y="230" font-size="20" font-weight="900" fill="#000" text-anchor="middle">T  O  Z</text>
    <text x="105" y="270" font-size="14" font-weight="900" fill="#000" text-anchor="middle">L  P  E  D</text>
    <text x="105" y="300" font-size="10" font-weight="900" fill="#000" text-anchor="middle">P  E  C  F  D</text>
    <rect x="25" y="345" width="160" height="50" rx="8" fill="#1A3857"/>
    <text x="105" y="367" fill="#FACC15" font-size="11" font-weight="bold" text-anchor="middle">Không cận / Cận ≤ 3D</text>
    <text x="105" y="385" fill="#94A3B8" font-size="10" text-anchor="middle">(Có cam kết chữa mắt)</text>
  </g>

  <!-- 3. Điện Tâm Đồ & Thể Lực (Heartbeat Pulse) -->
  <g transform="translate(620, 100)">
    <rect width="210" height="420" rx="16" fill="#0E243A" stroke="#EF4444" stroke-width="2"/>
    <text x="105" y="45" font-family="'Be Vietnam Pro'" font-size="16" font-weight="900" fill="#EF4444" text-anchor="middle">SỨC KHỎE LOẠI 1 &amp; 2</text>
    <!-- Trái tim phát sáng -->
    <circle cx="105" cy="140" r="50" fill="#881337" opacity="0.6"/>
    <path d="M 105 155 C 105 155 75 130 75 110 C 75 95 90 90 105 105 C 120 90 135 95 135 110 C 135 130 105 155 105 155 Z" fill="#EF4444"/>
    <!-- Đường sóng ECG -->
    <polyline points="20,240 60,240 75,200 90,280 105,180 120,260 135,220 150,240 190,240" 
              fill="none" stroke="#22C55E" stroke-width="4"/>
    <rect x="25" y="345" width="160" height="50" rx="8" fill="#1A3857"/>
    <text x="105" y="367" fill="#22C55E" font-size="11" font-weight="bold" text-anchor="middle">Không bệnh truyền nhiễm</text>
    <text x="105" y="385" fill="#94A3B8" font-size="10" text-anchor="middle">Không hình xăm phản cảm</text>
  </g>

  <!-- 4. Độ Tuổi Quy Định 22 & 25 -->
  <g transform="translate(870, 100)">
    <rect width="210" height="420" rx="16" fill="#0E243A" stroke="url(#goldAccent)" stroke-width="2"/>
    <text x="105" y="45" font-family="'Be Vietnam Pro'" font-size="16" font-weight="900" fill="url(#goldAccent)" text-anchor="middle">MỐC TUỔI DỰ TUYỂN</text>
    <circle cx="105" cy="150" r="60" fill="#996515" opacity="0.3"/>
    <text x="105" y="165" font-size="50" font-weight="900" fill="#FACC15" text-anchor="middle">22</text>
    <text x="105" y="235" fill="#E2E8F0" font-size="13" font-weight="bold" text-anchor="middle">Dân tộc Kinh: ≤ 22</text>
    <circle cx="105" cy="290" r="30" fill="#065F46" opacity="0.5"/>
    <text x="105" y="298" font-size="26" font-weight="900" fill="#34D399" text-anchor="middle">25</text>
    <text x="105" y="340" fill="#34D399" font-size="12" font-weight="bold" text-anchor="middle">Dân tộc thiểu số: ≤ 25</text>
    <rect x="25" y="365" width="160" height="35" rx="8" fill="#1A3857"/>
    <text x="105" y="387" fill="#FACC15" font-size="11" font-weight="bold" text-anchor="middle">Chiến sĩ nghĩa vụ: ≤ 30</text>
  </g>

  <!-- Tiêu Đề Đáy -->
  <text x="600" y="600" font-family="'Be Vietnam Pro', sans-serif" font-size="18" font-weight="900" fill="url(#goldAccent)" text-anchor="middle" letter-spacing="2">
    BỘ TIÊU CHUẨN THỂ LỰC VÀ ĐỘ TUỔI QUY CHẾ BỘ CÔNG AN
  </text>
</svg>
