<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="colBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="colGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="600" height="350" fill="url(#colBg)"/>

  <!-- THAO TRƯỜNG HUẤN LUYỆN & KHỐI CAO ĐẲNG -->
  <g transform="translate(120, 60)">
    <!-- Tòa nhà thực hành -->
    <rect x="60" y="50" width="260" height="160" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <rect x="50" y="35" width="280" height="20" rx="2" fill="#166534" stroke="url(#colGold)" stroke-width="1.5"/>

    <!-- Các hàng rào & chướng ngại vật thao trường -->
    <g stroke="#84cc16" stroke-width="3" stroke-linecap="round">
      <line x1="80" y1="180" x2="110" y2="150"/>
      <line x1="110" y1="150" x2="140" y2="180"/>
      <line x1="170" y1="180" x2="200" y2="150"/>
      <line x1="200" y1="150" x2="230" y2="180"/>
      <line x1="260" y1="180" x2="290" y2="150"/>
    </g>

    <!-- Biểu tượng bia ngắm bắn tác chiến -->
    <g transform="translate(190, 100)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#ef4444" stroke-width="3"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#ef4444"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#facc15" stroke-width="1.5"/>
      <line x1="0" y1="-35" x2="0" y2="35" stroke="#facc15" stroke-width="1.5"/>
    </g>
  </g>

  <!-- HUY HIỆU QUÂN HÀM HẠ SĨ QUAN -->
  <g transform="translate(430, 150)">
    <polygon points="30,10 60,30 60,90 0,90 0,30" fill="#dc2626" stroke="url(#colGold)" stroke-width="2"/>
    <!-- Vạch quân hàm hạ sĩ quan -->
    <line x1="10" y1="65" x2="50" y2="65" stroke="url(#colGold)" stroke-width="4"/>
    <line x1="10" y1="75" x2="50" y2="75" stroke="url(#colGold)" stroke-width="4"/>
  </g>

  <rect x="80" y="275" width="440" height="35" rx="8" fill="#1e293b" stroke="url(#colGold)" stroke-width="1.5"/>
  <text x="300" y="298" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="800" fill="#fde047" text-anchor="middle">KHỐI CAO ĐẲNG CAND (T07 • T09 • T10)</text>
</svg>
